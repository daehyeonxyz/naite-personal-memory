name: CI

# 하네스 정합성 게이트 — 지금까지 사람 손에만 의존하던 세 가지를 자동 검증한다:
#  1) 온톨로지 lint (facets/subject/topics/leaf-depth 규칙)
#  2) harness-lock 신선도 (버전·파일 해시 embed 가 최신인가 — 앱이 이걸 읽어 호환 판정)
#  3) .claude ↔ .agents 미러 동기 (CLAUDE.md/스킬을 고치고 sync-agents 를 안 돌린 드리프트 차단)
# 핵심 스크립트는 표준 라이브러리만 쓰므로 pip 설치가 필요 없다(forest-* 진단만 numpy/networkx).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ontology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint ontology (facets / subject / topics / leaf-depth)
        run: python .naite/scripts/lint-ontology.py

      - name: harness-lock is fresh (version + file hashes embedded)
        run: python .naite/scripts/build-harness-lock.py --check

      - name: .claude → .agents mirror is in sync
        run: |
          python .naite/scripts/sync-agents.py
          if ! git diff --exit-code -- AGENTS.md .agents/; then
            echo "::error::CLAUDE.md/.claude changed but the Codex mirror was not regenerated."
            echo "::error::Run 'python .naite/scripts/sync-agents.py' and commit AGENTS.md + .agents/."
            exit 1
          fi
